:root{
  --bg:#0d0f0e;--surf:#161a18;--surf2:#1d2220;--line:#262c29;--tx:#f2f4f1;--mut:#9aa39d;--dim:#6b736e;
  --acc:#b8f02a;--on-acc:#0d0f0e;--warn:#ff9f43;--bad:#ff5d5d;
  --c-spinta:#b8f02a;--c-cardio:#3ddcff;--c-tirata:#ff9f43;
  --r:14px;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{background:var(--bg);color:var(--tx)}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45;
  -webkit-font-smoothing:antialiased;min-height:100vh;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.cond{font-family:"BC","Arial Narrow",Impact,sans-serif;text-transform:uppercase;letter-spacing:.02em}
.app{max-width:520px;margin:0 auto;padding:calc(var(--safe-t) + 18px) 16px calc(96px + var(--safe-b))}
.noscript{padding:40px 20px;text-align:center;color:var(--mut)}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.top .who{font-size:.8rem;color:var(--mut);letter-spacing:.12em;text-transform:uppercase;font-weight:600}
.top h1{font-size:2rem;line-height:1;font-weight:800}
.wk{font-size:.78rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--on-acc);background:var(--acc);padding:5px 10px;border-radius:99px;white-space:nowrap}

/* cards */
.card{background:var(--surf);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:12px;animation:rise .35s ease both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.h2{font-size:1.7rem;font-weight:800;line-height:1.02;margin-top:2px}
.mut{color:var(--mut)}.small{font-size:.86rem}.tiny{font-size:.76rem}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}

/* banner */
.banner{border-radius:var(--r);padding:14px 16px;margin-bottom:12px;display:flex;gap:12px;align-items:center;animation:rise .35s ease both}
.banner.today{background:var(--acc);color:var(--on-acc)}
.banner.info{background:var(--surf2);border:1px solid var(--line)}
.banner.warn{background:#2a1f12;border:1px solid #4d3618;color:#ffd7ad}
.banner .ico{font-size:1.4rem;line-height:1}
.banner b{display:block}
.banner .btn{margin-left:auto}

/* hero today */
.hero{position:relative;overflow:hidden;border-radius:18px;padding:20px 18px;background:var(--surf);border:1px solid var(--line);margin-bottom:12px;animation:rise .35s ease both}
.hero::after{content:"";position:absolute;right:-50px;top:-50px;width:170px;height:170px;border-radius:50%;border:2px solid var(--sc,var(--acc));opacity:.35}
.hero .h1{font-size:2.9rem;font-weight:800;line-height:.92;margin:8px 0 6px;color:var(--sc,var(--acc))}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:.78rem;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mut);background:var(--surf2)}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc);font-weight:700}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 18px;border-radius:12px;font-weight:700;
  background:var(--surf2);border:1px solid var(--line);transition:transform .08s ease,opacity .2s}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.btn.wa{background:#25d366;border-color:#25d366;color:#05210f}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn[disabled]{opacity:.4}
.stack>*+*{margin-top:10px}

/* week strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.wd{text-align:center;padding:8px 0 10px;border-radius:12px;background:var(--surf2);border:1px solid var(--line)}
.wd .d{font-size:.68rem;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.wd .n{font-family:"BC",sans-serif;font-size:1.3rem;font-weight:700;line-height:1.1}
.wd .dot{width:8px;height:8px;border-radius:50%;margin:4px auto 0;background:transparent}
.wd.today{border-color:var(--acc)}
.wd .dot.plan{background:var(--dim)}
.wd .dot.done{background:var(--acc)}
.wd .dot.miss{background:var(--bad)}

/* session list */
.sess{display:flex;align-items:center;gap:12px;padding:14px;border-radius:var(--r);background:var(--surf);border:1px solid var(--line);margin-bottom:10px;width:100%;text-align:left;animation:rise .35s ease both}
.sess .bar{width:6px;align-self:stretch;border-radius:4px;background:var(--sc)}
.sess .t{font-size:1.4rem;font-weight:800;line-height:1}
.status{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:99px;white-space:nowrap}
.status.done{background:rgba(184,240,42,.15);color:var(--acc)}
.status.todo{background:var(--surf2);color:var(--mut)}
.status.live{background:rgba(255,159,67,.15);color:var(--warn)}

/* exercise list */
.ex{padding:14px 0;border-top:1px solid var(--line)}
.ex:first-of-type{border-top:0}
.ex .nm{font-weight:650;line-height:1.3}
.ex .tg{font-family:"BC",sans-serif;font-weight:700;font-size:1.25rem;color:var(--sc,var(--acc));white-space:nowrap}
.sets{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.set{min-width:44px;height:38px;padding:0 8px;border-radius:10px;border:1px solid var(--line);background:var(--surf2);display:inline-flex;align-items:center;justify-content:center;
  font-family:"BC",sans-serif;font-size:1.15rem;font-weight:700;color:var(--mut)}
.set.ok{background:var(--sc,var(--acc));border-color:var(--sc,var(--acc));color:var(--on-acc)}
.set .plus{font-size:.7rem;margin-left:2px;opacity:.85}
.grp{margin-top:14px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.note{border-left:3px solid var(--sc,var(--acc));padding:8px 12px;background:var(--surf2);border-radius:0 10px 10px 0;color:var(--mut);font-size:.88rem;margin:10px 0}
.note b{color:var(--tx)}

/* tabbar */
.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(13,15,14,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:6px 8px calc(6px + var(--safe-b));display:flex;justify-content:center;z-index:20}
.tabs .in{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;width:100%;max-width:520px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;border-radius:10px;color:var(--dim);font-size:.7rem;font-weight:700;letter-spacing:.04em}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--acc)}

/* overlay screens */
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.ov .body>*{animation:rise .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.ov .bar{display:flex;align-items:center;gap:10px;padding:calc(var(--safe-t) + 10px) 14px 10px;border-bottom:1px solid var(--line)}
.ov .body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:16px 16px calc(24px + var(--safe-b));max-width:520px;width:100%;margin:0 auto}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.prog{height:4px;background:var(--surf2);border-radius:4px;overflow:hidden;flex:1}
.prog i{display:block;height:100%;background:var(--sc,var(--acc));transition:width .4s ease}

/* guided */
.g-name{font-size:2.2rem;font-weight:800;line-height:.98}
.g-hint{color:var(--mut);margin-top:6px}
.g-set{margin-top:18px;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700}
.big{font-family:"BC",sans-serif;font-weight:800;font-size:6rem;line-height:.9;color:var(--sc,var(--acc));text-align:center;font-variant-numeric:tabular-nums}
.big small{font-size:2rem;color:var(--mut);margin-left:6px}
.stepper{display:flex;align-items:center;justify-content:center;gap:18px;margin:14px 0 6px}
.stepper button{width:64px;height:64px;border-radius:50%;background:var(--surf2);border:1px solid var(--line);font-size:2rem;font-weight:700;display:grid;place-items:center}
.stepper button:active{transform:scale(.94)}
.stepper .v{font-family:"BC",sans-serif;font-size:4.2rem;font-weight:800;min-width:110px;text-align:center;font-variant-numeric:tabular-nums}
.diff{text-align:center;font-weight:700;color:var(--acc);min-height:1.4em}
.ring{position:relative;width:240px;height:240px;margin:16px auto}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .lbl{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.ring .lbl .t{font-family:"BC",sans-serif;font-size:4.4rem;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.ring .lbl .s{font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--mut);font-weight:700;margin-top:4px}
.phase-work .ring .lbl .s{color:var(--sc,var(--acc))}
.mins{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px}
.foot{display:flex;gap:10px;margin-top:18px}
.foot .btn{flex:1}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{padding:8px 14px;font-weight:700;font-size:.88rem;color:var(--mut)}
.seg button.on{background:var(--acc);color:var(--on-acc)}

/* sheet */
.shade{position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:60;animation:fade .2s ease}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--surf);border-top:1px solid var(--line);border-radius:20px 20px 0 0;
  padding:18px 18px calc(18px + var(--safe-b));max-width:520px;margin:0 auto;animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

/* forms */
label.f{display:block;font-size:.8rem;color:var(--mut);font-weight:600;margin:12px 0 6px}
select,input[type=time],textarea,input[type=text],input[type=password]{width:100%;background:var(--surf2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;font-size:1rem}
textarea{min-height:76px;resize:vertical}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{height:52px;border-radius:12px;background:var(--surf2);border:1px solid var(--line);font-family:"BC",sans-serif;font-size:1.6rem;font-weight:800}
.scale button.on{background:var(--acc);border-color:var(--acc);color:var(--on-acc)}
.tglgrid{display:flex;flex-wrap:wrap;gap:8px}
.tgl{padding:9px 14px;border-radius:99px;border:1px solid var(--line);background:var(--surf2);font-weight:600;font-size:.9rem}
.tgl.on{background:var(--warn);border-color:var(--warn);color:#1b1206}

/* progress */
.goal{display:flex;justify-content:space-between;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.goal:first-of-type{border-top:0}
.goal b{font-family:"BC",sans-serif;font-size:1.2rem}
.bars{display:flex;align-items:flex-end;gap:8px;height:90px;margin-top:12px}
.bars .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px}
.bars .b i{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--acc);min-height:3px;transition:height .5s ease}
.bars .b span{font-size:.7rem;color:var(--mut);font-weight:700}
.chart{width:100%;height:110px;margin-top:8px}
.toast{position:fixed;left:50%;bottom:calc(90px + var(--safe-b));transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-weight:700;font-size:.9rem;z-index:90;animation:rise .25s ease}
.lockcard{text-align:center;padding:28px 18px}
.lockcard svg{width:40px;height:40px;color:var(--acc)}
</style>

<script>
(function(){
"use strict";

/* ============================================================
   DATI DELLA SCHEDA (dal coach — Alessandro non li può modificare)
   ============================================================ */
var START = new Date(2026, 9, 24);          // Settimana 1 del Blocco 1: sabato 24 ottobre 2026
var WEEKS = 4;                              // il Blocco 2 si sblocca col coach
var STORE_KEY = "scheda_alessandro_v1";
var ROLE = null;                            // accesso scelto: "host" (ospite), "alessandro" o "coach"

var SESSIONS = {
  spinta: {
    name: "Spinta", sub: "Push-up + dip", color: "var(--c-spinta)",
    warm: "<b>Riscaldamento (8′):</b> rotazioni polsi, scapular push-up 2×8, band pull-apart 2×15, push-up su rialzo 1×5 facili.",
    foot: "Se i push-up normali perdono la forma, passare alla versione inclinata o sulle ginocchia.",
    ex: [
      {id:"pu_tempo", name:"Push-up tempo 3-0-1", kind:"reps", plan:[[4,3],[4,4],[5,4],[3,4]]},
      {id:"dip_neg", name:"Dip negativi con loop band blu", hint:"Discesa 4–5″", kind:"reps", plan:[[4,2],[4,2],[5,2],[3,2]]},
      {id:"dip_iso_top", name:"Isometria dip in alto, braccia distese", kind:"time", plan:[[3,12],[3,15],[3,18],[2,12]]},
      {id:"dip_iso_60", name:"Tenuta dip a metà discesa (60°)", kind:"time", plan:[[3,6],[3,8],[3,10],[2,6]]},
      {id:"tri_bar", name:"Tricipiti alla sbarra bassa", kind:"reps", plan:[[3,6],[3,6],[3,8],[2,6]]},
      {id:"emom_pu", name:"EMOM push-up 5′", hint:"Rep al minuto 6-5-4-3-3", kind:"emom",
        plan:[{min:5,reps:[6,5,4,3,3]},{min:5,reps:[6,5,4,3,3]},{min:5,reps:[6,5,4,3,3]},{min:5,reps:[6,5,4,3,3]}]},
      {id:"emom_pu_inc", name:"EMOM push-up inclinati", hint:"Ogni minuto", kind:"emom",
        plan:[{min:8,reps:3},{min:8,reps:4},{min:10,reps:4},{min:8,reps:3}]}
    ]
  },
  cardio: {
    name: "Cardio", sub: "Passi giornalieri + corda", color: "var(--c-cardio)",
    warm: null,
    foot: "<b>Passi e corda:</b> i passi vanno fatti a ritmo svelto ma sostenibile, anche spezzati nell’arco della giornata. Per la corda: salti bassi e morbidi, scarpe ammortizzate e superficie non rigida. Se polpacci o tibie si irritano, accorciare il lavoro per minuto.",
    ex: [
      {id:"passi", name:"Passi al giorno", hint:"Tutti i giorni, non solo nel giorno cardio", kind:"info", plan:["8.000","9.000","10.000","8.000"]},
      {id:"corda", name:"Corda in EMOM", hint:"Lavoro ogni minuto, il resto è recupero", kind:"emomwork",
        plan:[{min:10,work:30},{min:12,work:30},{min:12,work:40},{min:8,work:30}]},
      {id:"defat", name:"Defaticamento e mobilità", hint:"Polpacci, caviglie", kind:"timer", plan:[5,5,5,5]}
    ]
  },
  tirata: {
    name: "Tirata + Core", sub: "Australian, pull-up, isometrie, core", color: "var(--c-tirata)",
    warm: "<b>Riscaldamento (8′):</b> scapular pull da sospeso 2×5, cat-cow, dead hang 1×10″, australian facili 1×5.",
    foot: null,
    ex: [
      {id:"aus_prone", name:"Australian prone, negative controllate", hint:"Discesa 3″", kind:"reps", plan:[[4,3],[4,4],[5,4],[3,4]]},
      {id:"aus_supine", name:"Australian supine, salita esplosiva", kind:"reps", plan:[[3,3],[3,3],[4,3],[2,3]]},
      {id:"pu_iso", name:"Isometria pull-up in alto", hint:"Mento sopra la sbarra", kind:"time", plan:[[3,8],[3,10],[3,12],[2,8]]},
      {id:"pu_neg", name:"Negativi pull-up", hint:"Discesa 5–6″", kind:"reps", plan:[[3,1],[3,1],[3,2],[2,1]]},
      {id:"dead_hang", name:"Dead hang", kind:"time", plan:[[3,15],[3,20],[3,25],[2,15]]},
      {id:"pull_neg", name:"Pull negative", kind:"reps", plan:[[3,2],[3,2],[3,2],[3,2]]},
      {id:"spiderman", name:"Spiderman con elastico", hint:"Per lato", kind:"reps", plan:[null,null,[2,3],null]},
      {id:"hollow", name:"Barchetta (hollow)", group:"Core", kind:"time", plan:[[3,15],[3,20],[3,25],[2,15]]},
      {id:"plank", name:"Plank", group:"Core", kind:"time", plan:[[3,25],[3,30],[3,35],[2,25]]},
      {id:"knees", name:"Ginocchia al petto da sospeso", group:"Core", kind:"reps", plan:[[3,4],[3,5],[3,6],[3,4]]}
    ]
  }
};
var ORDER = ["spinta","cardio","tirata"];
var GOALS = [
  {n:"Push-up massimali", from:"6 rep", to:"8–10"},
  {n:"Australian pull-up massimali", from:"6 rep", to:"9–10"},
  {n:"Dip negativo controllato", from:"1 rep", to:"5″ ×3"},
  {n:"Dead hang", from:"–", to:"30″"}
];
var PAINS = ["Polsi","Gomiti","Spalle","Schiena","Altro"];
var DOW = ["Dom","Lun","Mar","Mer","Gio","Ven","Sab"];
var DOW_L = ["domenica","lunedì","martedì","mercoledì","giovedì","venerdì","sabato"];
var MES = ["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"];

/* ============================================================
   SALVATAGGIO (memoria del browser + backup)
   ============================================================ */
var storageOK = true;
function blank(){ return {v:1, settings:null, sessions:[], draft:null, lastWeeklyPrompt:null}; }
function load(){
  try{
    var raw = localStorage.getItem(STORE_KEY);
    if(!raw) return blank();
    var d = JSON.parse(raw);
    if(!d || d.v !== 1) return blank();
    d.sessions = d.sessions || [];
    return d;
  }catch(e){ storageOK = false; return blank(); }
}
var S = load();
function save(){
  if(ROLE==="host") return;
  try{ localStorage.setItem(STORE_KEY, JSON.stringify(S)); storageOK = true; }
  catch(e){ storageOK = false; }
}
// prova di scrittura: alcune anteprime (es. iOS) non permettono di salvare
(function(){ try{ localStorage.setItem(STORE_KEY+"_t","1"); localStorage.removeItem(STORE_KEY+"_t"); }catch(e){ storageOK=false; } })();

/* ============================================================
   MODIFICHE DEL COACH ALLA SCHEDA (salvate a parte dai dati di Alessandro)
   ============================================================ */
var COACH_KEY = "scheda_alessandro_coach_v1";
var BASE = {};                                   // valori originali scritti nel file
function allEx(){ var a=[]; ORDER.forEach(function(t){ SESSIONS[t].ex.forEach(function(e){ a.push(e); }); }); return a; }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
allEx().forEach(function(e){ BASE[e.id] = clone(e.plan); });
function isInt(v,a,b){ return typeof v==="number" && isFinite(v) && Math.floor(v)===v && v>=a && v<=b; }
function planOK(e,p){                            // un valore settimanale è accettabile?
  if(p===null) return e.kind!=="info";           // null = esercizio non previsto quella settimana
  switch(e.kind){
    case "reps": return Array.isArray(p) && p.length===2 && isInt(p[0],1,10) && isInt(p[1],1,100);
    case "time": return Array.isArray(p) && p.length===2 && isInt(p[0],1,10) && isInt(p[1],1,600);
    case "emom": return !!p && typeof p==="object" && isInt(p.min,1,60) &&
                   (Array.isArray(p.reps) ? p.reps.length===p.min && p.reps.every(function(x){ return isInt(x,1,100); }) : isInt(p.reps,1,100));
    case "emomwork": return !!p && typeof p==="object" && isInt(p.min,1,60) && isInt(p.work,1,59);
    case "timer": return isInt(p,1,60);
    case "info": return typeof p==="string" && /^[\d.]{1,8}$/.test(p);
  }
  return false;
}
function loadCoach(){
  try{ var d = JSON.parse(localStorage.getItem(COACH_KEY)||"null"); if(d && d.v===1 && d.plan && typeof d.plan==="object") return d; }catch(e){}
  return {v:1, pin:null, rev:0, at:null, plan:{}};
}
function saveCoach(){ try{ localStorage.setItem(COACH_KEY, JSON.stringify(C)); return true; }catch(e){ return false; } }
var C = loadCoach();
function applyPlans(map){                        // valori attuali = originali + modifiche del coach
  allEx().forEach(function(e){
    var p = map && map[e.id];
    e.plan = (Array.isArray(p) && p.length===WEEKS && p.every(function(x){ return planOK(e,x); })) ? clone(p) : clone(BASE[e.id]);
  });
}
/* le sedute già salvate si ricordano i propri obiettivi: se il coach cambia la scheda, i vecchi report restano corretti */
function makeSnap(type, week, log){
  var o = {}, ss = SESSIONS[type]; if(!ss) return o;
  ss.ex.forEach(function(e){ if(log && log[e.id]) o[e.id] = {s:slots(e,week), t:exTarget(e,week)}; });
  return o;
}
(function(){ var ch=false; S.sessions.forEach(function(r){ if(!r.snap){ r.snap = makeSnap(r.type,r.week,r.log); ch=true; } }); if(ch) save(); })();
applyPlans(C.plan);
function recSlots(rec, e){ return (rec.snap && rec.snap[e.id]) ? rec.snap[e.id].s : slots(e, rec.week); }
function recTarget(rec, e){ return (rec.snap && rec.snap[e.id]) ? rec.snap[e.id].t : exTarget(e, rec.week); }

/* ============================================================
   DATE E SETTIMANE
   ============================================================ */
function d0(d){ var x=new Date(d); x.setHours(0,0,0,0); return x; }
function today(){ return d0(new Date()); }
function key(d){ var x=d0(d); return x.getFullYear()+"-"+pad(x.getMonth()+1)+"-"+pad(x.getDate()); }
function fromKey(k){ var p=k.split("-"); return new Date(+p[0],+p[1]-1,+p[2]); }
function pad(n){ return (n<10?"0":"")+n; }
function addDays(d,n){ var x=new Date(d); x.setDate(x.getDate()+n); return d0(x); }
function weekOf(d){ return Math.floor((d0(d)-START)/864e5/7)+1; }   // 1..4 = Blocco 1
function weekStart(w){ return addDays(START,(w-1)*7); }
function fmt(d){ return DOW[d.getDay()].toLowerCase()+" "+d.getDate()+" "+MES[d.getMonth()]; }
function curWeek(){ return weekOf(today()); }
function locked(){ return curWeek() > WEEKS; }
function planWeek(){ return Math.max(1, Math.min(WEEKS, curWeek())); }

function sessionForDate(d){
  if(!S.settings) return null;
  var wd = d0(d).getDay();
  for(var i=0;i<ORDER.length;i++){ if(S.settings.days[ORDER[i]] === wd) return ORDER[i]; }
  return null;
}
function doneIn(type, w){
  return S.sessions.filter(function(s){ return s.type===type && s.week===w; })[0] || null;
}
function doneOn(dk){
  return S.sessions.filter(function(s){ return s.date===dk; });
}

/* ============================================================
   UTILITÀ
   ============================================================ */
function esc(s){ return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function $(sel,root){ return (root||document).querySelector(sel); }
function sec(n){ return n+"″"; }
function mmss(t){ t=Math.max(0,Math.ceil(t)); var m=Math.floor(t/60), s=t%60; return m+":"+pad(s); }
function toast(msg){
  var t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t);
  setTimeout(function(){ t.remove(); }, 2200);
}
function vib(p){ try{ if(navigator.vibrate) navigator.vibrate(p); }catch(e){} }

/* suoni: si attivano al primo tocco (regola di iPhone) */
var AC=null;
function audio(){
  if(!AC){ try{ AC = new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ AC=null; } }
  if(AC && AC.state==="suspended") AC.resume();
  return AC;
}
document.addEventListener("touchstart", audio, {once:true, passive:true});
document.addEventListener("click", audio, {once:true});
function beep(freq, dur, vol){
  var a=audio(); if(!a) return;
  var o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type="sine"; o.frequency.value=freq||880;
  g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol||0.35,t+0.01);
  g.gain.exponentialRampToValueAtTime(0.0001,t+(dur||0.15));
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+(dur||0.15)+0.02);
}
function tick(){ beep(880,0.12); vib(40); }
function goBeep(){ beep(1320,0.45,0.45); vib([120,60,120]); }

/* ============================================================
   PIANO DELLA SETTIMANA
   ============================================================ */
function exPlan(ex, w){ return ex.plan[w-1]; }
function exTarget(ex, w){
  var p = exPlan(ex,w); if(p==null) return "–";
  switch(ex.kind){
    case "reps": return p[0]+"×"+p[1];
    case "time": return p[0]+"×"+sec(p[1]);
    case "emom": return Array.isArray(p.reps) ? p.min+"′ · "+p.reps.join("-") : p.min+"′ · "+p.reps+" rep";
    case "emomwork": return p.min+"′ · "+p.work+"″";
    case "timer": return p+"′";
    case "info": return p;
  }
}
function slots(ex, w){        // valori bersaglio per ogni serie/minuto
  var p = exPlan(ex,w); if(p==null) return [];
  if(ex.kind==="reps"||ex.kind==="time"){ var a=[]; for(var i=0;i<p[0];i++) a.push(p[1]); return a; }
  if(ex.kind==="emom"){ var b=[]; for(var j=0;j<p.min;j++) b.push(Array.isArray(p.reps)?p.reps[j]:p.reps); return b; }
  if(ex.kind==="emomwork"){ var c=[]; for(var k=0;k<p.min;k++) c.push(p.work); return c; }
  if(ex.kind==="timer") return [p*60];
  return [];
}
function activeEx(type, w){ return SESSIONS[type].ex.filter(function(e){ return e.kind!=="info" && exPlan(e,w)!=null; }); }

/* ============================================================
   SEDUTA IN CORSO (bozza salvata, si riprende se chiude l'app)
   ============================================================ */
function newDraft(type){
  var w = planWeek();
  var log = {};
  activeEx(type,w).forEach(function(e){ log[e.id] = {vals: slots(e,w).map(function(){return null;}), note:""}; });
  return {type:type, week:w, date:key(today()), startedAt:Date.now(), log:log, exIdx:0, setIdx:0};
}
function draftDone(dr){
  var all=0, ok=0;
  Object.keys(dr.log).forEach(function(k){ dr.log[k].vals.forEach(function(v){ all++; if(v!=null) ok++; }); });
  return {all:all, ok:ok};
}

/* ============================================================
   NAVIGAZIONE
   ============================================================ */
var view = "oggi";
var TABS = [
  {id:"oggi", l:"Oggi", i:'<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'},
  {id:"settimana", l:"Settimana", i:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>'},
  {id:"progressi", l:"Progressi", i:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'},
  {id:"altro", l:"Impostazioni", i:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.6-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>'}
];
function svg(p){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+p+'</svg>'; }
function renderTabs(){
  var tl = tabsFor();
  $("#tabs").innerHTML = '<div class="in" style="grid-template-columns:repeat('+tl.length+',1fr)">'+tl.map(function(t){
    return '<button class="tab'+(view===t.id?' on':'')+'" data-a="tab" data-v="'+t.id+'">'+svg(t.i)+'<span>'+t.l+'</span></button>';
  }).join("")+'</div>';
}
function render(){
  renderTabs();
  var html = ROLE===null ? vRole() : ROLE==="coach" ? (view==="scheda" ? vCoachScheda() : vCoachAtleta()) :
             !S.settings ? vOnboard() : view==="oggi" ? vToday() : view==="settimana" ? vWeek() : view==="progressi" ? vProgress() : view==="guida" ? vGuide() : vSettings();
  $("#app").innerHTML = html;
  $("#tabs").style.display = (ROLE===null || (ROLE!=="coach" && !S.settings)) ? "none" : "";
  window.scrollTo(0,0);
}

/* ============================================================
   SCHERMATE
   ============================================================ */
function header(title){
  var wk = locked() ? "Blocco 1 completato" : "Blocco 1 · Sett. "+planWeek()+(planWeek()===4?" scarico":"");
  return '<div class="top"><div><div class="who">Alessandro</div><h1 class="cond">'+title+'</h1></div><span class="wk cond">'+wk+'</span></div>'+
    (ROLE==="host" ? '<div class="banner info"><div class="ico">👀</div><div class="small"><b>Accesso ospite</b>Sola lettura, con dati di esempio.</div></div>' : '');
}
function storageBanner(){
  if(storageOK) return "";
  return '<div class="banner warn"><div class="ico">⚠️</div><div class="small"><b>Salvataggio non disponibile qui</b>Apri il file con Safari o Chrome. Quello che segni ora non resta salvato: a fine seduta usa “Condividi report”.</div></div>';
}
function lockCard(){
  return '<div class="card lockcard">'+svg('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>')+
    '<div class="h2 cond" style="margin-top:10px">Blocco 1 completato</div><p class="mut small" style="margin:8px 0 14px">Il Blocco 2 è da sbloccare col coach. Mandagli il riepilogo e aspetta la nuova scheda.</p>'+
    '<button class="btn pri block" data-a="weekly">Condividi riepilogo (PDF)</button></div>';
}

function nextSession(){
  for(var i=1;i<=7;i++){ var d=addDays(today(),i), t=sessionForDate(d); if(t) return {type:t,date:d}; }
  return null;
}
function weekStrip(){
  var w = curWeek(), ws = weekStart(Math.max(1,w)), t = key(today());
  var cells = "";
  for(var i=0;i<7;i++){
    var d = addDays(ws,i), dk = key(d), type = sessionForDate(d), cls = "";
    if(type){
      var don = S.sessions.some(function(s){ return s.type===type && s.week===weekOf(d); });
      cls = don ? "done" : (dk < t ? "miss" : "plan");
    }
    cells += '<div class="wd'+(dk===t?' today':'')+'"><div class="d">'+DOW[d.getDay()]+'</div><div class="n">'+d.getDate()+'</div><div class="dot '+cls+'"></div></div>';

function chart(pts){
  var W=320,H=100,pX=10,pY=12, max=Math.max.apply(null,pts.map(function(p){return p.v;}))||1, min=0;
  var n=pts.length, xs=function(i){ return n===1 ? W/2 : pX+(W-2*pX)*i/(n-1); }, ys=function(v){ return H-pY-(H-2*pY)*(v-min)/(max-min||1); };
  var line = pts.map(function(p,i){ return (i?'L':'M')+xs(i).toFixed(1)+' '+ys(p.v).toFixed(1); }).join(" ");
  var area = line+' L'+xs(n-1).toFixed(1)+' '+(H-pY)+' L'+xs(0).toFixed(1)+' '+(H-pY)+' Z';
  var dots = pts.map(function(p,i){ return '<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(p.v).toFixed(1)+'" r="3.5" fill="#b8f02a"/>'; }).join("");
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="none"><path d="'+area+'" fill="rgba(184,240,42,.12)"/><path d="'+line+'" fill="none" stroke="#b8f02a" stroke-width="2.5" stroke-linejoin="round" vector-effect="non-scaling-stroke"/>'+dots+'</svg>'+
    '<div class="row between tiny mut"><span>'+fmt(fromKey(pts[0].d))+'</span><span>'+fmt(fromKey(pts[n-1].d))+'</span></div>';
}

function openSession(type){
  var cw = curWeek(), done = doneIn(type, cw);

    (done ? '<span class="status done">Fatto</span>' : '')+'</div><div class="body">';
  if(s.warm) h += '<div class="note">'+s.warm+'</div>';
  var lastGroup = null;
  s.ex.forEach(function(e){
    if(exPlan(e,w)==null && !(rec && rec.log[e.id])) return;
    if(e.group && e.group!==lastGroup){ h += '<div class="grp">'+e.group+'</div>'; lastGroup=e.group; }

    if(e.kind!=="info" && lg){
      var sl = rec ? recSlots(rec,e) : slots(e,w);
      h += '<div class="sets">'+lg.vals.map(function(v,i){
        var label = v==null ? (e.kind==="timer"?"—":(e.kind==="emomwork"?"m"+(i+1):sl[i])) : (e.kind==="timer"||e.kind==="emomwork" ? "✓" : v);
        var plus = (v!=null && (e.kind==="reps"||e.kind==="emom"||e.kind==="time") && v>sl[i]) ? '<span class="plus">+'+(v-sl[i])+'</span>' : '';
        var editable = (e.kind==="reps"||e.kind==="emom"||e.kind==="time");
        return '<button class="set'+(v!=null?' ok':'')+'" '+(editable?'data-a="edit" data-t="'+type+'" data-e="'+e.id+'" data-i="'+i+'"':'disabled')+'>'+label+(e.kind==="time"&&v!=null?"″":"")+plus+'</button>';
      }).join("")+'</div>';
      if(lg.note) h += '<div class="mut small" style="margin-top:6px">📝 '+esc(lg.note)+'</div>';

    h += '<div class="card" style="margin-top:12px"><div class="kick">Com’è andata</div><p class="small" style="margin-top:6px">Fatica <b>'+(done.fatigue||"–")+'/5</b> · Dolori: '+(done.pains&&done.pains.length?esc(done.pains.join(", ")):"nessuno")+'</p>'+(done.note?'<p class="small mut" style="margin-top:4px">📝 '+esc(done.note)+'</p>':'')+'</div>';
    h += '<button class="btn pri block" data-a="sendsession" data-id="'+done.id+'">Condividi il report PDF di questa seduta</button>';
  } else if(!locked()){
    h += '<div class="stack" style="margin-top:16px"><button class="btn pri block" data-a="start" data-t="'+type+'">'+(S.draft&&S.draft.type===type?'▶ Riprendi allenamento guidato':'▶ Avvia allenamento guidato')+'</button>'+
      (S.draft&&S.draft.type===type ? '<button class="btn block" data-a="finish">Termina e salva la seduta</button><button class="btn block" data-a="discard" style="color:var(--bad)">Annulla seduta in corso</button>' : '')+'</div>';
  }
  h += '</div></div>';
  layer.innerHTML = h; document.body.style.overflow="hidden";

/* foglio per correggere un valore segnato */
function editValue(type, exId, idx){
  var rec = (S.draft && S.draft.type===type) ? S.draft : doneIn(type, curWeek());
  if(!rec) return;
  var e = SESSIONS[type].ex.filter(function(x){return x.id===exId;})[0];
  var target = recSlots(rec,e)[idx];
  var cur = rec.log[exId].vals[idx]; if(cur==null) cur = target;
  var unit = e.kind==="time" ? "″" : " rep";
  var shade = document.createElement("div"); shade.className="shade";
  var sh = document.createElement("div"); sh.className="sheet";
  sh.innerHTML = '<div class="kick">'+esc(e.name)+' · '+(e.kind==="emom"?'minuto':'serie')+' '+(idx+1)+'</div><div class="mut small">Obiettivo: '+target+unit+'</div>'+
    '<div class="stepper"><button data-s="-1">−</button><div class="v cond" id="sv">'+cur+'</div><button data-s="1">+</button></div><div class="diff" id="sd"></div>'+
    '<div class="foot"><button class="btn" data-s="clear">Non fatta</button><button class="btn pri" data-s="ok">Salva</button></div>';
  document.body.appendChild(shade); document.body.appendChild(sh);
  function upd(){ $("#sv",sh).textContent=cur; $("#sd",sh).textContent = cur>target ? "+"+(cur-target)+unit+" oltre l’obiettivo 💥" : ""; }
  upd();
  function close(){ shade.remove(); sh.remove(); }
  shade.onclick = close;
  sh.onclick = function(ev){
    var b = ev.target.closest("[data-s]"); if(!b) return;
    var a = b.getAttribute("data-s");
    if(a==="1"){ cur++; upd(); } else if(a==="-1"){ cur=Math.max(0,cur-1); upd(); }
    else if(a==="clear"){ rec.log[exId].vals[idx]=null; save(); close(); openSession(type); }
    else if(a==="ok"){ rec.log[exId].vals[idx]=cur; save(); close(); openSession(type); }
  };
}

   ============================================================ */
var timer = null;       // {end, total, onTick, onDone, last}
function stopTimer(){ if(timer){ clearInterval(timer.h); timer=null; } }
function runTimer(seconds, onTick, onDone){
  stopTimer();
  var t = {end: Date.now()+seconds*1000, total:seconds, last:null};
  t.h = setInterval(function(){
    var left = (t.end-Date.now())/1000;
    var whole = Math.ceil(left);
    if(whole!==t.last){
      t.last = whole;
      if(whole<=3 && whole>=1) tick();
      onTick(Math.max(0,left), whole);
    } else onTick(Math.max(0,left), whole);
    if(left<=0){ stopTimer(); goBeep(); onDone(); }
  }, 100);
  timer = t;
}
function ring(frac, big, small){
  var r=110, c=2*Math.PI*r;
  return '<div class="ring"><svg viewBox="0 0 240 240"><circle cx="120" cy="120" r="'+r+'" fill="none" stroke="#262c29" stroke-width="12"/>'+
    '<circle id="rg" cx="120" cy="120" r="'+r+'" fill="none" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+(c*(1-frac)).toFixed(1)+'" style="color:var(--sc,var(--acc));transition:stroke-dashoffset .15s linear"/></svg>'+
    '<div class="lbl"><div class="t" id="rt">'+big+'</div><div class="s" id="rs">'+small+'</div></div></div>';
}
function setRing(frac, big, small){
  var rg=$("#rg"); if(!rg) return; var c=2*Math.PI*110;
  rg.setAttribute("stroke-dashoffset",(c*(1-frac)).toFixed(1));
  if(big!=null) $("#rt").textContent=big; if(small!=null) $("#rs").textContent=small;
}

function guided(){
  stopTimer();
  var dr=S.draft, s=SESSIONS[dr.type], list=activeEx(dr.type,dr.week);
  if(dr.exIdx>=list.length){ return finishScreen(); }
  var e=list[dr.exIdx], sl=slots(e,dr.week), lg=dr.log[e.id];
  var top = '<div class="kick" style="color:var(--sc)">'+(e.group||s.name)+'</div><div class="g-name cond">'+e.name+'</div>'+(e.hint?'<div class="g-hint">'+e.hint+'</div>':'')+
            '<div class="sets" style="margin-top:12px">'+lg.vals.map(function(v,i){ return '<span class="set'+(v!=null?' ok':'')+'" style="'+(i===dr.setIdx?'outline:2px solid var(--tx)':'')+'">'+(v!=null?(e.kind==="emomwork"||e.kind==="timer"?"✓":v):(e.kind==="emomwork"?"m"+(i+1):(e.kind==="timer"?"—":sl[i])))+'</span>'; }).join("")+'</div>';
  var inner;

var PG_W=595.28, PG_H=841.89, PG_M=40;
var K_INK=[.05,.06,.055], K_LIME=[.72,.94,.16], K_MUT=[.36,.39,.37], K_SOFT=[.955,.96,.95], K_LINE=[.86,.88,.86], K_WHITE=[1,1,1], K_BAD=[.78,.18,.18], K_OK=[.2,.38,.02];
var SESS_RGB = {spinta:[.72,.94,.16], cardio:[.24,.86,1], tirata:[1,.62,.26]};
/* larghezze dei caratteri Helvetica (ASCII 32–126), per andare a capo */
var PDF_CW = [278,278,355,556,556,889,667,191,333,333,389,584,278,333,278,278,556,556,556,556,556,556,556,556,556,556,278,278,584,584,584,556,
  1015,667,667,722,722,667,611,778,722,278,500,667,556,833,722,778,667,778,722,667,611,722,667,944,667,667,611,278,278,278,469,556,
  333,556,556,500,556,556,278,556,556,222,222,500,222,833,556,556,556,556,333,500,278,556,500,722,500,500,500,334,260,334,584];
function pdfEnc(s){                              // testo -> un byte per carattere (WinAnsi)
  var o="", i, c, m={0x2019:39,0x2018:39,0x201C:34,0x201D:34,0x2033:34,0x2032:39,0x2212:45,0x2013:0x96,0x2014:0x97,0x2022:0x95,0x2026:0x85};
  s = String(s==null?"":s);
  for(i=0;i<s.length;i++){
    c = s.charCodeAt(i);
    if(c>=0xD800 && c<=0xDBFF){ i++; continue; }                // emoji: il PDF non le contiene, si saltano
    if(c===0xFE0F || c===0x200D){ continue; }
    if(c<32){ o+=" "; continue; }
    if(c<127 || (c>=160 && c<=255)){ o+=String.fromCharCode(c); continue; }
    o += m[c] ? String.fromCharCode(m[c]) : "?";
  }
  return o;
}
function pdfStr(s){
  var e=pdfEnc(s), o="", i, c;
  for(i=0;i<e.length;i++){
    c = e.charCodeAt(i);
    if(c===40||c===41||c===92) o += "\\"+e.charAt(i);
    else if(c>126) o += "\\"+("00"+c.toString(8)).slice(-3);
    else o += e.charAt(i);
  }
  return "("+o+")";
}
function pdfW(s,size,bold){
  var e=pdfEnc(s), w=0, i, c;
  for(i=0;i<e.length;i++){ c=e.charCodeAt(i); w += (c>=32 && c<=126) ? PDF_CW[c-32] : 556; }
  return w*size/1000*(bold?1.06:1);
}
function pdfWrap(s,size,bold,max){
  var out=[];
  String(s==null?"":s).split("\n").forEach(function(par){
    var cur="";
    par.split(" ").forEach(function(wd){
      var t = cur ? cur+" "+wd : wd;
      if(pdfW(t,size,bold)<=max){ cur=t; return; }
      if(cur){ out.push(cur); cur=""; }
      while(pdfW(wd,size,bold)>max && wd.length>1){        // parola più larga della colonna
        var k=wd.length; while(k>1 && pdfW(wd.slice(0,k),size,bold)>max) k--;
        out.push(wd.slice(0,k)); wd=wd.slice(k);
      }
      cur=wd;
    });
    out.push(cur);
  });
  return out;
}
function col3(c){ return c[0].toFixed(3)+" "+c[1].toFixed(3)+" "+c[2].toFixed(3); }
function PdfDoc(title){ this.title=title; this.pages=[]; this.newPage(); }
PdfDoc.prototype.newPage = function(){ this.cur=[]; this.pages.push(this.cur); this.y=PG_H-PG_M; };
PdfDoc.prototype.ensure = function(h){ if(this.y-h < PG_M+10) this.newPage(); };
PdfDoc.prototype.rect = function(x,y,w,h,c){ this.cur.push(col3(c)+" rg "+x.toFixed(2)+" "+y.toFixed(2)+" "+w.toFixed(2)+" "+h.toFixed(2)+" re f"); };
PdfDoc.prototype.text = function(x,y,s,size,bold,c){ this.cur.push("BT "+col3(c)+" rg /"+(bold?"F2":"F1")+" "+size+" Tf "+x.toFixed(2)+" "+y.toFixed(2)+" Td "+pdfStr(s)+" Tj ET"); };
PdfDoc.prototype.finish = function(){
  var self=this, n=this.pages.length, out, offs=[], N=5+2*n, i, xpos, u;
  this.pages.forEach(function(c,i){
    self.cur=c; var t="Pagina "+(i+1)+" di "+n;
    self.text(PG_M,22,"Scheda calisthenics · Alessandro Acerbi",7.5,false,K_MUT);
    self.text(PG_W-PG_M-pdfW(t,7.5,false),22,t,7.5,false,K_MUT);
  });
  out = "%PDF-1.4\n%âãÏÓ\n";
  function add(id,body){ offs[id]=out.length; out += id+" 0 obj\n"+body+"\nendobj\n"; }
  add(1,"<< /Type /Catalog /Pages 2 0 R >>");
  var kids=[]; for(i=0;i<n;i++) kids.push((6+2*i)+" 0 R");
  add(2,"<< /Type /Pages /Kids ["+kids.join(" ")+"] /Count "+n+" >>");
  add(3,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  add(4,"<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  add(5,"<< /Title "+pdfStr(this.title)+" /Producer (Scheda Alessandro) >>");
  this.pages.forEach(function(c,i){
    var data=c.join("\n");
    add(6+2*i,"<< /Type /Page /Parent 2 0 R /MediaBox [0 0 "+PG_W+" "+PG_H+"] /Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents "+(7+2*i)+" 0 R >>");
    add(7+2*i,"<< /Length "+data.length+" >>\nstream\n"+data+"\nendstream");
  });
  xpos = out.length;
  out += "xref\n0 "+(N+1)+"\n0000000000 65535 f \n";
  for(i=1;i<=N;i++) out += ("0000000000"+offs[i]).slice(-10)+" 00000 n \n";
  out += "trailer\n<< /Size "+(N+1)+" /Root 1 0 R /Info 5 0 R >>\nstartxref\n"+xpos+"\n%%EOF";
  u = new Uint8Array(out.length);
  for(i=0;i<out.length;i++) u[i]=out.charCodeAt(i)&255;
  return u;
};

function execText(r,e){
  var lg=r.log[e.id], sl=recSlots(r,e), done=lg.vals.filter(function(v){ return v!=null; }).length;
  if(done===0) return {t:"non fatto", bad:true, extra:""};
  if(e.kind==="reps"||e.kind==="emom"||e.kind==="time"){
    var u = e.kind==="time" ? "″" : "";
    var plus = lg.vals.reduce(function(a,v,i){ return a+(v!=null && v>sl[i] ? v-sl[i] : 0); },0);
    return {t:lg.vals.map(function(v){ return v==null ? "–" : v+u; }).join(" / "), bad:false, extra: plus ? "+"+plus+u : ""};
  }
  return {t: done===lg.vals.length ? "fatto" : done+"/"+lg.vals.length+" min", bad:false, extra:""};
}
function pdfSessionBlock(doc, r, withBar){

  doc.y -= 22;
  function head(){

    var y=doc.y;

/* condivisione: foglio di condivisione del telefono (WhatsApp, Mail, Files…); se non c'è, scarica il file */
function saveBlob(blob, name){
  var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download=name;
  document.body.appendChild(a); a.click(); setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 4000);
}
function shareFile(bytes, name, mime, title){
  var blob=new Blob([bytes],{type:mime});
  try{
    var f=new File([blob],name,{type:mime});
    if(navigator.canShare && navigator.canShare({files:[f]})){
      navigator.share({files:[f], title:title}).catch(function(err){ if(!err || err.name!=="AbortError") saveBlob(blob,name); });
      return;
    }
  }catch(e){}
  saveBlob(blob,name);
}
function shareSession(r){ shareFile(sessionPdf(r), "report_"+r.type+"_sett"+r.week+"_"+r.date+".pdf", "application/pdf", "Report seduta - Alessandro Acerbi"); }

function hashPin(p){
  var h1=0xdeadbeef, h2=0x41c6ce57, s="scheda-alessandro|"+p, i, ch;
  for(i=0;i<s.length;i++){ ch=s.charCodeAt(i); h1=Math.imul(h1^ch,2654435761); h2=Math.imul(h2^ch,1597334677); }
  h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);
  h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);
  return String(4294967296*(2097151&h2)+(h1>>>0));
}

function coachSetField(id, f, raw){          // applica un valore scritto dal coach; false se non è valido
  var e=allEx().filter(function(x){ return x.id===id; })[0], w=CE.w, arr=CE.plan[id], p=arr[w-1], isNum, n;
  raw = String(raw).trim(); isNum = /^\d{1,3}$/.test(raw); n = isNum ? parseInt(raw,10) : NaN;
  switch(e.kind){
    case "reps": case "time":
      if(f==="a" && isInt(n,1,10)){ p[0]=n; return true; }
      if(f==="b" && isInt(n,1,e.kind==="time"?600:100)){ p[1]=n; return true; }
      return false;
    case "emom":
      if(f==="m"){ if(!Array.isArray(p.reps) && isInt(n,1,60)){ p.min=n; return true; } return false; }
      if(isInt(n,1,100)){ p.reps=n; return true; }
      if(/^\d{1,3}(\s*[-,]\s*\d{1,3})+$/.test(raw)){
        var l=raw.split(/\s*[-,]\s*/).map(Number);
        if(l.length<=60 && l.every(function(x){ return isInt(x,1,100); })){ p.reps=l; p.min=l.length; return true; }
      }
      return false;
    case "emomwork":
      if(f==="m" && isInt(n,1,60)){ p.min=n; return true; }
      if(f==="w" && isInt(n,1,59)){ p.work=n; return true; }
      return false;
    case "timer": if(isInt(n,1,60)){ arr[w-1]=n; return true; } return false;
    case "info": if(/^[\d.]{1,8}$/.test(raw)){ arr[w-1]=raw; return true; } return false;
  }
  return false;
}

function shareJson(name, text, title){
  var blob=new Blob([text],{type:"application/json"});
  try{                                         // alcuni telefoni accettano solo certi tipi: provo json, poi testo
    var tries=["application/json","text/plain"], i, f;
    for(i=0;i<tries.length;i++){

      if(navigator.canShare && navigator.canShare({files:[f]})){
        navigator.share({files:[f], title:title}).catch(function(err){ if(!err || err.name!=="AbortError") saveBlob(blob,name); });

    }
  }catch(e){}

    return h+'<div class="card"><div class="kick">Monitoraggio</div><p class="small mut" style="margin:8px 0 14px">Qui vedi cosa fa Alessandro: sedute, rep, fatica, dolori, note e progressi. I dati arrivano dal suo backup: lui lo crea da Impostazioni → Esporta backup e te lo manda, tu lo importi qui.</p>'+
      '<button class="btn pri block" data-a="atletapick">⬆︎ Importa il backup di Alessandro</button>'+atletaPicker()+'</div>';
  }
  var ss = AT.data.sessions.slice().sort(function(a,b){ return b.endedAt-a.endedAt; });
  h += '<div class="card"><div class="kick">Ultimo backup</div><div class="h2 cond">'+ss.length+' sedute</div><p class="small mut" style="margin-top:6px">Importato il '+dstr(AT.at)+(ss[0]?' · ultima seduta '+fmt(fromKey(ss[0].date)):'')+'</p>'+
    '<button class="btn sm block" style="margin-top:10px" data-a="atletapick">⬆︎ Importa un backup più recente</button>'+atletaPicker()+'</div>';
  h += '<div class="card"><div class="kick">Costanza</div><div class="bars">'+[1,2,3,4].map(function(n){
    var c = ORDER.filter(function(t){ return ss.some(function(s){ return s.type===t && s.week===n; }); }).length;
    return '<div class="b"><i style="height:'+Math.max(3,c/3*70)+'px"></i><span>S'+n+' · '+c+'/3</span></div>';
  }).join("")+'</div></div>';
  h += '<div class="kick" style="margin:14px 0 10px">Sedute</div>'+(ss.length ? ss.map(function(r){
    var s=SESSIONS[r.type];
    return '<button class="sess" style="--sc:'+s.color+'" data-a="msess" data-id="'+esc(r.id)+'"><span class="bar"></span><span class="grow"><span class="t cond" style="display:block">'+s.name+'</span>'+
      '<span class="mut small">Sett. '+r.week+' · '+fmt(fromKey(r.date))+' · fatica '+(r.fatigue||"–")+'/5'+(r.pains&&r.pains.length?' · ⚠ '+esc(r.pains.join(", ")):'')+'</span></span></button>';
  }).join("") : '<p class="mut small">Nessuna seduta nel backup.</p>');
  return h + '<div class="kick" style="margin:16px 0 4px">Progressi</div>' + trackCards(ss);
}
function coachSessView(id){
  var r = AT && AT.data.sessions.filter(function(x){ return x.id===id; })[0]; if(!r) return;
  var s=SESSIONS[r.type], last=null;
  var h = '<div class="ov" style="--sc:'+s.color+'"><div class="bar"><button class="icon-btn" data-a="close" aria-label="Chiudi">'+svg('<path d="M15 18l-6-6 6-6"/>')+'</button>'+
    '<div class="grow"><div class="kick">Settimana '+r.week+(r.week===4?' · scarico':'')+' · '+fmt(fromKey(r.date))+'</div><div class="cond" style="font-size:1.5rem;font-weight:800;line-height:1">'+s.name+'</div></div></div><div class="body">'+
    '<div class="card"><p class="small">Fatica <b>'+(r.fatigue||"–")+'/5</b> · Dolori: '+(r.pains&&r.pains.length?esc(r.pains.join(", ")):"nessuno")+' · Durata '+Math.max(1,Math.round((r.endedAt-r.startedAt)/60000))+'′</p>'+
    (r.note?'<p class="small mut" style="margin-top:6px">📝 '+esc(r.note)+'</p>':'')+'</div>';
  s.ex.forEach(function(e){
    var lg=r.log[e.id]; if(!lg) return;
    if(e.group && e.group!==last){ h += '<div class="grp">'+e.group+'</div>'; last=e.group; }
    var sl=recSlots(r,e);
    h += '<div class="ex"><div class="row between"><div class="grow"><div class="nm">'+esc(e.name)+'</div>'+(e.hint?'<div class="mut tiny">'+esc(e.hint)+'</div>':'')+'</div><div class="tg">'+esc(recTarget(r,e))+'</div></div><div class="sets">'+
      lg.vals.map(function(v,i){
        var plus = (v!=null && (e.kind==="reps"||e.kind==="emom"||e.kind==="time") && v>sl[i]) ? '<span class="plus">+'+(v-sl[i])+'</span>' : '';
        var lab = v==null ? "–" : ((e.kind==="timer"||e.kind==="emomwork") ? "✓" : v+(e.kind==="time"?"″":""));
        return '<span class="set'+(v!=null?' ok':'')+'">'+lab+plus+'</span>';
      }).join("")+'</div></div>';
  });
  h += '<button class="btn pri block" style="margin-top:14px" data-a="msend" data-id="'+esc(r.id)+'">Condividi il report PDF</button></div></div>';
  layer.innerHTML = h; document.body.style.overflow="hidden";
}

/* ---- accesso coach: scheda ---- */
function vCoachScheda(){
  return coachTop("Scheda")+
    '<div class="card"><div class="kick">Scheda attuale</div><div class="h2 cond">'+(C.rev ? 'Versione '+C.rev : 'Originale')+'</div>'+
    '<p class="small mut" style="margin-top:6px">'+(C.rev ? 'Ultima modifica: '+dstr(C.at)+'.' : 'Non hai ancora modificato nulla.')+'</p>'+
    '<div class="stack" style="margin-top:12px"><button class="btn pri block" data-a="ceditor">✏️ Modifica scheda</button>'+
    (C.rev ? '<button class="btn block" data-a="cshare">Condividi la scheda con Alessandro</button>' : '')+'</div></div>'+
    '<div class="card"><div class="kick">Come arriva ad Alessandro</div><p class="small mut" style="margin-top:6px">Salvi le modifiche e condividi il file della scheda. Alessandro lo importa da Impostazioni → Scheda del coach e la sua scheda si aggiorna: i suoi allenamenti restano.</p></div>';
}

/* ============================================================
   AZIONI
   ============================================================ */
document.addEventListener("click", function(ev){
  var b = ev.target.closest("[data-a]"); if(!b) return;
  var a = b.getAttribute("data-a"), t = b.getAttribute("data-t");
  if(ROLE==="host" && HOST_OK.indexOf(a)<0){ toast("Ospite: sola lettura. Guarda la Guida per vedere come funziona."); return; }
  switch(a){
    case "pick": pickRole(b.getAttribute("data-v")); break;
    case "role": goRole(); break;
    case "tab": (function(){ var v=b.getAttribute("data-v"); if(v==="esci"){ goRole(); return; } view=v; render(); })(); break;
    case "onboard":
    case "savesettings":
      var days = {}; var used = {};
      for(var i=0;i<ORDER.length;i++){ var v=+$("#f-"+ORDER[i]).value; if(used[v]){ window.alert("Hai scelto lo stesso giorno per due sedute: scegline tre diversi."); return; } used[v]=1; days[ORDER[i]]=v; }
      S.settings = {days:days, time:$("#f-time").value||"18:30", alarm: S.settings ? +($("#f-alarm")||{value:60}).value : 60};
      save(); if(a==="onboard") view="oggi"; render(); toast("Salvato"); break;
    case "open": openSession(t); break;
    case "close": closeLayer(); break;
    case "start": startGuided(t); break;
    case "resume": startGuided(S.draft.type); break;
    case "edit": editValue(t, b.getAttribute("data-e"), +b.getAttribute("data-i")); break;
    case "finish": firstOpen(); S.draft.exIdx = activeEx(S.draft.type,S.draft.week).length; finishScreen(); break;
    case "discard": if(window.confirm("Annullare la seduta in corso? Le serie segnate andranno perse.")){ S.draft=null; save(); closeLayer(); } break;
    case "gclose": stopTimer(); var ty=S.draft?S.draft.type:null; layer.innerHTML=""; if(ty) openSession(ty); else closeLayer(); break;
    case "gskip": stopTimer(); S.draft.exIdx++; S.draft.setIdx=0; save(); guided(); break;
    case "gback": S.draft.exIdx=0; firstOpen(); if(S.draft.exIdx>=activeEx(S.draft.type,S.draft.week).length){ S.draft.exIdx=0; } guided(); break;
    case "st": gStep.cur=Math.max(0,gStep.cur+(+b.getAttribute("data-d"))); updStep(); break;
    case "setdone":
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx];
      dr.log[e.id].vals[dr.setIdx]=gStep.cur; goBeep(); advance(); restScreen(); break;
    case "holdgo": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx], tg=slots(e,dr.week)[dr.setIdx];
      b.disabled=true;
      runTimer(3, function(left,w){ setRing(left/3, w, "preparati"); }, function(){
        runTimer(tg, function(left){ setRing(left/tg, Math.ceil(left), "tieni"); }, function(){
          dr.log[e.id].vals[dr.setIdx]=tg; advance(); restScreen();
        });
      });
    })(); break;
    case "holdmanual": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx], tg=slots(e,dr.week)[dr.setIdx];
      gStep.cur=tg; gStep.tgt=tg; gStep.unit="″";
      var s=SESSIONS[dr.type], list=activeEx(dr.type,dr.week);
      layer.innerHTML = gShell('<div class="g-name cond">'+e.name+'</div><div class="g-set">Serie '+(dr.setIdx+1)+' · secondi tenuti</div>'+
        '<div class="stepper"><button data-a="st" data-d="-1">−</button><div class="v cond" id="sv">'+tg+'</div><button data-a="st" data-d="1">+</button></div><div class="diff" id="sd"></div>'+
        '<div class="foot"><button class="btn pri" data-a="setdone">✓ Serie fatta</button></div>', s, dr, list);
    })(); break;
    case "emomgo": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx], sl=slots(e,dr.week), m=0;
      b.disabled=true;
      function minute(){
        if(m>=sl.length){ return emomReview(e, sl); }
        $("#em-r").innerHTML = sl[m]+'<small>rep</small>';
        goBeep();
        runTimer(60, function(left){ setRing(left/60, mmss(left), "minuto "+(m+1)+" di "+sl.length); }, function(){ dr.log[e.id].vals[m]=sl[m]; save(); m++; minute(); });
      }
      runTimer(3, function(left,w){ setRing(left/3, w, "si parte"); }, minute);
    })(); break;
    case "ropego": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx], p=exPlan(e,dr.week), m=0;
      b.disabled=true;
      function minute(){
        if(m>=p.min){ goBeep(); advance(); return restOrNext(); }
        var ov=$(".ov"); ov.classList.add("phase-work");
        runTimer(p.work, function(left){ setRing(left/p.work, Math.ceil(left)+"″", "salta · min "+(m+1)+"/"+p.min); }, function(){
          ov.classList.remove("phase-work");
          dr.log[e.id].vals[m]=p.work; save();
          var rest=60-p.work;
          runTimer(rest, function(left){ setRing(left/rest, Math.ceil(left)+"″", "recupero · min "+(m+1)+"/"+p.min); }, function(){ m++; minute(); });
        });
      }
      runTimer(3, function(left,w){ setRing(left/3, w, "si parte"); }, minute);
    })(); break;
    case "timergo": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx], tot=exPlan(e,dr.week)*60;
      b.disabled=true;
      runTimer(tot, function(left){ setRing(left/tot, mmss(left), "in corso"); }, function(){ dr.log[e.id].vals[0]=tot; advance(); restOrNext(); });
    })(); break;
    case "timerdone": (function(){ var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx]; dr.log[e.id].vals[0]=exPlan(e,dr.week)*60; advance(); restOrNext(); })(); break;
    case "emomsave": (function(){
      var dr=S.draft, e=activeEx(dr.type,dr.week)[dr.exIdx];
      dr.log[e.id].vals = emomVals.slice(); advance(); restOrNext();
    })(); break;
    case "emv": (function(){ var i=+b.getAttribute("data-i"), d=+b.getAttribute("data-d"); emomVals[i]=Math.max(0,emomVals[i]+d); $("#emv"+i).textContent=emomVals[i]; })(); break;
    case "restlen": restLen=+b.getAttribute("data-v"); restScreen.restart(); $$seg(b); break;
    case "restplus": restScreen.add(); break;
    case "restskip": stopTimer(); guided(); break;
    case "fat": S.draft.fatigue=+b.getAttribute("data-v"); save(); keepNote(); finishScreen(); break;
    case "pain": (function(){ var p=b.getAttribute("data-v"), arr=S.draft.pains, k=arr.indexOf(p); if(k>=0) arr.splice(k,1); else arr.push(p); save(); keepNote(); finishScreen(); })(); break;
    case "savesession": (function(){
      var rec=commitSession(); stopTimer();
      layer.innerHTML = '<div class="ov" style="--sc:'+SESSIONS[rec.type].color+'"><div class="body" style="display:flex;flex-direction:column;justify-content:center;min-height:100%">'+
        '<div class="g-name cond" style="color:var(--sc);font-size:3rem">Salvata ✓</div><p class="mut" style="margin:8px 0 22px">Ottimo lavoro. Condividi il report PDF con il coach.</p>'+
        '<div class="stack"><button class="btn pri block" data-a="sendsession" data-id="'+rec.id+'">Condividi report PDF</button><button class="btn block" data-a="close">Chiudi</button></div></div></div>';
    })(); break;
    case "sendsession": (function(){ var id=b.getAttribute("data-id"), r=S.sessions.filter(function(s){return s.id===id;})[0]; if(r) shareSession(r); })(); break;
    case "weekly": shareWeekly(); break;
    case "ceditor": coachEditorOpen(); break;
    case "atletapick": $("#f-atleta").click(); break;
    case "msess": coachSessView(b.getAttribute("data-id")); break;
    case "msend": (function(){ var r=AT && AT.data.sessions.filter(function(x){ return x.id===b.getAttribute("data-id"); })[0]; if(r) shareSession(r); })(); break;
    case "cclose": closeLayer(); break;
    case "cpin": coachPin(); break;
    case "cweek": if(CE){ CE.w=+b.getAttribute("data-v"); coachEditor(); } break;
    case "ctype": if(CE){ CE.t=b.getAttribute("data-v"); coachEditor(); } break;
    case "csave": if(CE){ coachSave(); coachEditor(); } break;
    case "cshare": coachShare(); if(CE) coachEditor(); break;
    case "schedapick": $("#f-scheda").click(); break;
    case "ics": ics(); break;
    case "export": exportBackup(); break;
    case "importpick": $("#f-import").click(); break;
  }
});
document.addEventListener("change", function(ev){
  var el=ev.target; if(!el) return;
  if(el.id==="f-import" && el.files[0]) importBackup(el.files[0]);
  else if(el.id==="f-scheda" && el.files[0]){ importScheda(el.files[0]); el.value=""; }
  else if(el.id==="f-atleta" && el.files[0]){ importAtleta(el.files[0]); el.value=""; }
  else if(CE && el.getAttribute && el.getAttribute("data-c")==="f"){        // a fine scrittura: riporta i campi ai valori validi
    var id=el.getAttribute("data-id"), e=allEx().filter(function(x){ return x.id===id; })[0], p=CE.plan[id][CE.w-1];
    Array.prototype.forEach.call(document.querySelectorAll('#layer input[data-c="f"][data-id="'+id+'"]'), function(inp){
      var v=coachDisplay(id, inp.getAttribute("data-f"));
      if(inp.value!==v) inp.value=v;
      inp.style.borderColor="";
      if(e.kind==="emom" && inp.getAttribute("data-f")==="m") inp.disabled=Array.isArray(p.reps);
    });
  }
});
document.addEventListener("input", function(ev){
  var el=ev.target; if(!CE || !el || !el.getAttribute || el.getAttribute("data-c")!=="f") return;
  el.style.borderColor = coachSetField(el.getAttribute("data-id"), el.getAttribute("data-f"), el.value) ? "" : "var(--bad)";
});
function $$seg(b){ var p=b.parentNode; Array.prototype.forEach.call(p.children,function(x){ x.classList.toggle("on", x===b); }); }
function keepNote(){ var n=$("#f-note"); if(n) S.draft.note=n.value; }
function restOrNext(){ var dr=S.draft; if(dr.exIdx>=activeEx(dr.type,dr.week).length) return guided(); restScreen(); }

var emomVals=[];
function emomReview(e, sl){
  stopTimer(); goBeep();
  var dr=S.draft, s=SESSIONS[dr.type], list=activeEx(dr.type,dr.week);
  emomVals = dr.log[e.id].vals.map(function(v,i){ return v==null?sl[i]:v; });
  var inner = '<div class="g-name cond">EMOM finito</div><p class="mut" style="margin-top:6px">Hai fatto qualche rep in più in qualche minuto? Segnalo qui.</p>'+
    emomVals.map(function(v,i){ return '<div class="row between" style="padding:10px 0;border-top:1px solid var(--line)"><span class="small">Minuto '+(i+1)+' <span class="mut">· obiettivo '+sl[i]+'</span></span>'+
      '<span class="row"><button class="icon-btn" data-a="emv" data-i="'+i+'" data-d="-1">−</button><b class="cond" id="emv'+i+'" style="font-size:1.6rem;min-width:36px;text-align:center">'+v+'</b><button class="icon-btn" data-a="emv" data-i="'+i+'" data-d="1">+</button></span></div>'; }).join("")+
    '<div class="foot"><button class="btn pri" data-a="emomsave">✓ Salva e continua</button></div>';
  layer.innerHTML = gShell(inner,s,dr,list);
}

render();
})();
</script>
